# Pile de production de Candidash sur le serveur, déployée par Dokploy (service de type Compose).
# Dokploy ne construit rien : il tire les images publiées sur GHCR par la CI.
#
# - Aucun port publié : le trafic arrive par le tunnel Cloudflare, puis le Traefik de Dokploy, qui
#   joint `candidash-web` par `dokploy-network`. Le domaine se règle dans l'onglet Domains de Dokploy
#   (service `candidash-web`, port 8080), qui ajoute les labels Traefik. L'API n'est pas exposée :
#   le front la relaie sous `/api/` par le réseau interne de la pile.
# - Base de données hors de la pile : un service Postgres de Dokploy (`POSTGRES_HOST`), joint par
#   `dokploy-network`. L'API et la sauvegarde sont donc aussi sur ce réseau, sans label Traefik :
#   rien ne les route depuis l'extérieur. Redéployer ou supprimer la pile ne touche pas aux données.
# - Variables : onglet Environment de Dokploy, écrit dans le `.env` voisin (modèle :
#   `candidash.env.example`). Chaque service ne reçoit que les siennes.
# - Noms de service préfixés : `dokploy-network` est partagé avec les autres piles du serveur, où un
#   nom comme `api` ou `postgres` pourrait désigner le conteneur d'un autre projet.
# - Migrations : l'API applique celles en attente à son démarrage, avant d'écouter.
# - Retour à une version : fixer `WEB_IMAGE` / `API_IMAGE` sur un tag `sha-<commit>` et redéployer.

name: candidash

services:
  candidash-web:
    image: ${WEB_IMAGE:-ghcr.io/j-ned/candidash-web:latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    depends_on:
      - candidash-api
    environment:
      # Adresse interne de l'API, relayée sous /api/ ; le navigateur ne connaît que /api/v1.
      API_UPSTREAM: http://candidash-api:3000
      # Écrites dans config.json au démarrage du conteneur.
      EXTENSION_ID: ${EXTENSION_ID:-}
      FIREFOX_ADDON_URL: ${FIREFOX_ADDON_URL:-}
    networks:
      - default
      - dokploy-network

  candidash-api:
    image: ${API_IMAGE:-ghcr.io/j-ned/candidash-api:latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    environment:
      # Base hors de la pile : si elle ne répond pas encore, l'API s'arrête au démarrage et Docker la
      # relance jusqu'à ce qu'elle réponde.
      - DATABASE_URL=postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@${POSTGRES_HOST:?}:5432/${POSTGRES_DB:?}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?}
      # Derrière le tunnel Cloudflare, Traefik puis le front ne voient que l'adresse du tunnel :
      # celle du visiteur est dans cet en-tête, que le front relaie tel quel. Sûr tant qu'aucun port
      # du serveur n'est ouvert sur Internet.
      - CLIENT_IP_HEADER=${CLIENT_IP_HEADER:-cf-connecting-ip}
      - JWT_SECRET=${JWT_SECRET:?}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:?}
      - CRON_SECRET=${CRON_SECRET:?}
      - S3_ENDPOINT=${S3_ENDPOINT:?}
      - S3_REGION=${S3_REGION:-auto}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?}
      - S3_BUCKET=${S3_BUCKET:?}
      - RESEND_API_KEY=${RESEND_API_KEY:?}
      - MAIL_FROM=${MAIL_FROM:?}
      # Facultatives : transmises seulement si elles sont définies.
      - MAIL_FROM_NAME
      - CONTACT_RECIPIENT
    networks:
      - default
      - dokploy-network

  # Tâches quotidiennes de l'API (relances, purges), à 7 h UTC comme l'ancien cron Vercel. Un échec
  # est journalisé et la boucle continue : les relances dues partent au passage suivant.
  candidash-cron:
    image: ${API_IMAGE:-ghcr.io/j-ned/candidash-api:latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    depends_on:
      - candidash-api
    environment:
      CRON_SECRET: ${CRON_SECRET:?}
    healthcheck:
      disable: true
    command:
      - sh
      - -c
      - |
        while :; do
          sleep "$$(( (111600 - $$(date -u +%s) % 86400 - 1) % 86400 + 1 ))"
          if wget -q -O /dev/null --header "Authorization: Bearer $$CRON_SECRET" http://candidash-api:3000/api/v1/cron/daily; then
            echo "$$(date -u +%FT%TZ) cron quotidien : ok"
          else
            echo "$$(date -u +%FT%TZ) cron quotidien : échec" >&2
          fi
        done

  # Sauvegarde quotidienne chiffrée de la base vers un bucket hors du serveur (`backup/backup.sh`).
  candidash-backup:
    image: ${BACKUP_IMAGE:-ghcr.io/j-ned/candidash-backup:latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    environment:
      PGHOST: ${POSTGRES_HOST:?}
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:?}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:?}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:?}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?}
    networks:
      - default
      - dokploy-network

networks:
  dokploy-network:
    external: true
