# Pile de production de Candidash sur le serveur, déployée par Dokploy (service de type Compose).
# Dokploy ne construit rien : il tire les images publiées sur GHCR par la CI.
#
# - Aucun port publié : le trafic arrive par le tunnel Cloudflare, puis le Traefik de Dokploy, qui
#   joint `candidash-web` (port 8080) et `candidash-api` (port 3000) par `dokploy-network`. Les deux
#   domaines se règlent dans l'onglet Domains de Dokploy, qui ajoute les labels Traefik.
# - Variables : onglet Environment de Dokploy, écrit dans le `.env` voisin (modèle :
#   `candidash.env.example`). Chaque service ne reçoit que les siennes.
# - Noms de service préfixés : `dokploy-network` est partagé avec les autres piles du serveur, où un
#   nom comme `api` ou `postgres` pourrait désigner le conteneur d'un autre projet.
# - Migrations : l'API applique celles en attente à son démarrage, avant d'écouter.
# - Retour à une version : fixer `WEB_IMAGE` / `API_IMAGE` sur un tag `sha-<commit>` et redéployer.

name: candidash

services:
  candidash-web:
    image: ${WEB_IMAGE:-ghcr.io/j-ned/candidash-web:latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    environment:
      # Écrites dans config.json et dans la CSP au démarrage du conteneur.
      API_URL: ${API_URL:?}
      EXTENSION_ID: ${EXTENSION_ID:-}
      FIREFOX_ADDON_URL: ${FIREFOX_ADDON_URL:-}
    networks:
      - default
      - dokploy-network

  candidash-api:
    image: ${API_IMAGE:-ghcr.io/j-ned/candidash-api:latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    depends_on:
      candidash-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@candidash-db:5432/${POSTGRES_DB:?}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?}
      # Derrière le tunnel Cloudflare, Traefik ne voit que l'adresse du tunnel : celle du visiteur
      # est dans cet en-tête. Sûr tant qu'aucun port du serveur n'est ouvert sur Internet.
      - CLIENT_IP_HEADER=${CLIENT_IP_HEADER:-cf-connecting-ip}
      - JWT_SECRET=${JWT_SECRET:?}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:?}
      - CRON_SECRET=${CRON_SECRET:?}
      - S3_ENDPOINT=${S3_ENDPOINT:?}
      - S3_REGION=${S3_REGION:-auto}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?}
      - S3_BUCKET=${S3_BUCKET:?}
      - MAIL_HOST=${MAIL_HOST:?}
      - MAIL_USER=${MAIL_USER:?}
      - MAIL_PASSWORD=${MAIL_PASSWORD:?}
      # Facultatives : transmises seulement si elles sont définies.
      - MAIL_PORT
      - MAIL_FROM_NAME
      - MAIL_FROM_ADDRESS
      - CONTACT_RECIPIENT
    networks:
      - default
      - dokploy-network

  # Tâches quotidiennes de l'API (relances, purges), à 7 h UTC comme l'ancien cron Vercel. Un échec
  # est journalisé et la boucle continue : les relances dues partent au passage suivant.
  candidash-cron:
    image: ${API_IMAGE:-ghcr.io/j-ned/candidash-api:latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    depends_on:
      - candidash-api
    environment:
      CRON_SECRET: ${CRON_SECRET:?}
    healthcheck:
      disable: true
    command:
      - sh
      - -c
      - |
        while :; do
          sleep "$$(( (111600 - $$(date -u +%s) % 86400 - 1) % 86400 + 1 ))"
          if wget -q -O /dev/null --header "Authorization: Bearer $$CRON_SECRET" http://candidash-api:3000/api/v1/cron/daily; then
            echo "$$(date -u +%FT%TZ) cron quotidien : ok"
          else
            echo "$$(date -u +%FT%TZ) cron quotidien : échec" >&2
          fi
        done

  candidash-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      # Postgres 18 range ses données dans un sous-dossier par version
      # (PGDATA=/var/lib/postgresql/18/docker) : le volume se monte un cran au-dessus.
      - candidash-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  # Sauvegarde quotidienne chiffrée de la base vers un bucket hors du serveur (`backup/backup.sh`).
  candidash-backup:
    image: ${BACKUP_IMAGE:-ghcr.io/j-ned/candidash-backup:latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    depends_on:
      candidash-db:
        condition: service_healthy
    environment:
      PGHOST: candidash-db
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:?}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:?}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:?}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?}

volumes:
  candidash-db-data:

networks:
  dokploy-network:
    external: true
