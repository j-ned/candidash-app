# Cache long et immutable seulement pour les URL versionnées : nom haché par le build
# (chunk-XXXXXXXX.js) ou empreinte ?v= (médias, sprite). Les autres (favicon, polices, captures)
# gardent la même URL d'une version à l'autre : un jour, puis revalidation.
map $uri$is_args$args $asset_cache_control {
    "~-[A-Za-z0-9_-]{8}\.(js|mjs|css)$"  "public, max-age=31536000, immutable";
    ~[?&]v=                            "public, max-age=31536000, immutable";
    default                            "public, max-age=86400";
}

server {
    # Non-root : nginx porte la capacité NET_BIND_SERVICE (cf. Dockerfile) pour écouter sur 80
    listen 80;
    # Redirections relatives : le proxy TLS en amont garde le schéma https
    absolute_redirect off;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité, CSP comprise (générée au démarrage, cf. entrypoint.sh).
    # add_header n'est pas hérité par un location qui en déclare : chaque location HTML inclut ce bloc.
    include /etc/nginx/conf.d/security-headers.inc;

    # Nonce CSP régénéré à chaque requête : le marqueur posé au build (ngCspNonce) devient $request_id,
    # la même valeur que dans l'en-tête Content-Security-Policy.
    sub_filter_once off;
    sub_filter '**CSP_NONCE**' $request_id;

    # Routes sans page prérendue (/dashboard, /auth/…) : coquille CSR vierge. index.html est
    # l'accueil prérendu ; le servir ici ferait flasher l'accueil avant la vraie route.
    location / {
        try_files $uri $uri/ /index.csr.html;
    }

    # Pas de cache sur les pages HTML (accueil, pages prérendues, coquille CSR) : un nouveau
    # déploiement est pris immédiatement, sans pointer vers des chunks disparus.
    location ~ \.html$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # config.json est réécrit au démarrage du conteneur (variables Dokploy) : sans en-tête, le
    # navigateur le garderait en cache par heuristique et afficherait l'ancienne configuration.
    # no-cache = revérification à chaque visite (304 si rien n'a changé).
    location = /config.json {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    # Assets : durée de cache selon que l'URL est versionnée ou non (cf. map en tête)
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|mp4|webm)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control $asset_cache_control always;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/wasm;
}
