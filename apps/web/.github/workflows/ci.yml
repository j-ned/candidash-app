name: CI

# Sur une PR : lint, tests, build, garanties du build (pages prérendues, CSP) et test de fumée du
# front servi comme en production (Worker + Static Assets sous wrangler dev). Sur master, une fois
# ces contrôles verts : déploiement sur Cloudflare (wrangler deploy).
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Un run par branche/PR : le nouveau push annule le précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Test · Build · Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # pnpm avant setup-node : la version vient du champ `packageManager` de package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck Worker
        run: pnpm typecheck:worker

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify build
        run: ci/verify-build.sh dist/ng-candidash-app/browser

      - name: Smoke test (wrangler dev)
        run: |
          pnpm exec wrangler dev --port 8787 --var API_URL:https://api.example.test/api/v1 > wrangler.log 2>&1 &
          ci/smoke.sh http://127.0.0.1:8787 || { cat wrangler.log; exit 1; }

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Jeton API Cloudflare limité à « Workers Scripts: Edit » sur le compte
      - name: Build and deploy
        run: pnpm cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
