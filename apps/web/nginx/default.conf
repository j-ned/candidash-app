# Front Candidash en statique, derrière Traefik (TLS terminé en amont). Mêmes règles que le
# service « web » du vercel.json racine : en-têtes de sécurité, caches, repli SPA, 404 des assets.

# Icônes, médias de démo et badges : immuables seulement quand l'URL porte son empreinte (?v=…).
map $arg_v $versioned_asset_cache {
  ""      "no-cache";
  default "public, max-age=31536000, immutable";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  absolute_redirect off;
  charset utf-8;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Pages prérendues (/features → features/index.html), sinon la coquille CSR pour les routes
  # de l'application. Le HTML est toujours revalidé : il référence les bundles du déploiement.
  location / {
    include /tmp/candidash/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/index.html /index.csr.html;
  }

  # Bundles nommés par leur empreinte de contenu.
  location ~ "^/(?:main|chunk|styles|polyfills|worker)-[A-Za-z0-9_-]{8}\.(?:js|css)$" {
    include /tmp/candidash/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri @asset_not_found;
  }

  location ~ ^/(?:icons|demo|badges)/ {
    include /tmp/candidash/security-headers.conf;
    add_header Cache-Control $versioned_asset_cache always;
    try_files $uri @asset_not_found;
  }

  location ^~ /fonts/ {
    include /tmp/candidash/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    try_files $uri @asset_not_found;
  }

  # Configuration lue par le front à son démarrage, écrite à celui du conteneur depuis ses
  # variables d'environnement (40-candidash-config.sh) : la même image sert tout environnement.
  location = /config.json {
    include /tmp/candidash/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    alias /tmp/candidash/config.json;
  }

  # Tout autre fichier (favicon, robots.txt, pages .html) : revalidé à chaque fois.
  # Un fichier absent répond 404, jamais la coquille HTML à la place d'un script.
  location ~ \.[a-zA-Z0-9]+$ {
    include /tmp/candidash/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri @asset_not_found;
  }

  location @asset_not_found {
    include /tmp/candidash/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    return 404;
  }
}
