# Front Candidash en statique et relais de l'API, derrière Traefik (TLS terminé en amont) : /api/
# vers l'API, en-têtes de sécurité, caches, repli SPA, 404 des assets.

# Icônes, médias de démo et badges : immuables seulement quand l'URL porte son empreinte (?v=…).
map $arg_v $versioned_asset_cache {
  ""      "no-cache";
  default "public, max-age=31536000, immutable";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  absolute_redirect off;
  charset utf-8;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # L'API n'est jointe que par ce relais, sur le réseau interne de la pile : elle n'est pas exposée.
  # `^~` écarte les règles par extension plus bas (un CV en .pdf est une route de l'API). L'adresse
  # passe par une variable et le DNS de Docker : nginx la résout à nouveau quand le conteneur de
  # l'API est recréé, au lieu de garder l'ancienne adresse jusqu'à son propre redémarrage.
  location ^~ /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    include /tmp/candidash/api-upstream.conf;
    # Dépôt d'un CV ou d'une lettre : 5 Mo côté API, plus l'enveloppe multipart.
    client_max_body_size 6m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass $candidash_api;
  }

  # Pages prérendues (/features → features/index.html), sinon la coquille CSR pour les routes
  # de l'application. Le HTML est toujours revalidé : il référence les bundles du déploiement.
  location / {
    include /tmp/candidash/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/index.html /index.csr.html;
  }

  # Bundles nommés par leur empreinte de contenu.
  location ~ "^/(?:main|chunk|styles|polyfills|worker)-[A-Za-z0-9_-]{8}\.(?:js|css)$" {
    include /tmp/candidash/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri @asset_not_found;
  }

  location ~ ^/(?:icons|demo|badges)/ {
    include /tmp/candidash/security-headers.conf;
    add_header Cache-Control $versioned_asset_cache always;
    try_files $uri @asset_not_found;
  }

  location ^~ /fonts/ {
    include /tmp/candidash/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    try_files $uri @asset_not_found;
  }

  # Configuration lue par le front à son démarrage, écrite à celui du conteneur depuis ses
  # variables d'environnement (40-candidash-config.sh) : la même image sert tout environnement.
  location = /config.json {
    include /tmp/candidash/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    alias /tmp/candidash/config.json;
  }

  # Tout autre fichier (favicon, robots.txt, pages .html) : revalidé à chaque fois.
  # Un fichier absent répond 404, jamais la coquille HTML à la place d'un script.
  location ~ \.[a-zA-Z0-9]+$ {
    include /tmp/candidash/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri @asset_not_found;
  }

  location @asset_not_found {
    include /tmp/candidash/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    return 404;
  }
}
