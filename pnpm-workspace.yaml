packages:
  - apps/*

# Délai de 14 jours avant d'adopter une version publiée (attaques supply chain).
minimumReleaseAge: 20160
# Les peers optionnelles (drivers de drizzle-orm : prisma, mysql2…) ne s'installent pas d'office.
autoInstallPeers: false
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

# Le plugin Vitest d'Analog importe `typescript` sans le déclarer : il recevrait le TypeScript 7
# hissé à la racine (celui de l'API, sans API JS). Déclaré en peer, il prend celui du front (6.x).
packageExtensions:
  '@analogjs/vite-plugin-angular':
    peerDependencies:
      typescript: '*'
