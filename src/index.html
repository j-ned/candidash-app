<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Candidash - Gère tes candidatures simplement !</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Candidash - Centralisez et suivez vos candidatures d'emploi simplement et efficacement."
    />
    <!-- Thème posé avant le premier rendu (même règle que ThemeManager : choix enregistré, sinon
         préférence système) : ni éclair clair en mode sombre, ni capture du mauvais thème. -->
    <script nonce="**CSP_NONCE**">
      try {
        var theme =
          localStorage.getItem('theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.classList.add(theme);
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preload" href="/config.json" as="fetch" crossorigin="anonymous" />
    <!-- Police du texte visible dès le premier rendu : préchargée pour ne pas retarder le LCP. -->
    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="dns-prefetch" href="https://api-candidash.nedellec-julien.fr" />
    <link rel="preconnect" href="https://api-candidash.nedellec-julien.fr" crossorigin />
  </head>
  <body>
    <!-- **CSP_NONCE** est remplacé par nginx à chaque requête ($request_id), même valeur que l'en-tête CSP -->
    <app-root ngCspNonce="**CSP_NONCE**"></app-root>
  </body>
</html>
