<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 pb-2">
  <div class="bg-card border border-border rounded-xl p-4 text-center transition-all hover:border-primary/30 hover:bg-primary/5">
    <div class="text-3xl font-bold text-text">{{ stats().total }}</div>
    <div class="text-sm text-muted mt-1">Total</div>
  </div>
  <div class="bg-card border border-border rounded-xl p-4 text-center transition-all hover:border-blue-500/30 hover:bg-blue-500/5">
    <div class="text-3xl font-bold text-info">{{ stats().applied }}</div>
    <div class="text-sm text-muted mt-1">Envoyées</div>
  </div>
  <div class="bg-card border border-border rounded-xl p-4 text-center transition-all hover:border-primary/30 hover:bg-primary/5">
    <div class="text-3xl font-bold text-primary">{{ stats().interview }}</div>
    <div class="text-sm text-muted mt-1">Entretiens prévus</div>
  </div>
  <div class="bg-card border border-border rounded-xl p-4 text-center transition-all hover:border-green-500/30 hover:bg-green-500/5">
    <div class="text-3xl font-bold text-success">{{ stats().accepted }}</div>
    <div class="text-sm text-muted mt-1">Acceptées</div>
  </div>
  <div class="bg-card border border-border rounded-xl p-4 text-center transition-all hover:border-error/30 hover:bg-error/5">
    <div class="text-3xl font-bold text-error">{{ stats().rejected }}</div>
    <div class="text-sm text-muted mt-1">Refusées</div>
  </div>
</div>
