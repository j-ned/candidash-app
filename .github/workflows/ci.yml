name: CI

# API (apps/api) et front (apps/web) vérifiés en parallèle sur chaque PR et sur master, puis
# leurs images Docker construites et vérifiées. Sur master, les images partent sur GHCR et
# Dokploy les redéploie (docs/bascule-dokploy.md) ; l'API applique ses migrations au démarrage.
# Tant que le projet Vercel existe, son intégration Git déploie aussi master de son côté.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Un run par branche/PR : le nouveau push annule le précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · Typecheck · Test · Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: candidash
          POSTGRES_PASSWORD: candidash
          POSTGRES_DB: candidash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U candidash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://candidash:candidash@localhost:5432/candidash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm avant setup-node : la version vient du champ `packageManager` du package.json racine.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrations
        run: pnpm db:migrate

      - name: Tests
        run: pnpm test

      - name: Bundles (Vercel et Docker)
        run: pnpm build

  web:
    name: Web · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify build
        run: ci/verify-build.sh dist/ng-candidash-app/browser

  # Images de production : construites et vérifiées sur chaque PR (un Dockerfile cassé se voit
  # avant la fusion), publiées et déployées seulement depuis master.
  images:
    name: Images · Build · Vérification · GHCR
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      # Doit rester l'origine autorisée par connect-src (apps/web/nginx/security-headers.conf).
      API_URL: https://api-candidash.nedellec-julien.fr/api/v1
      EXTENSION_ID: ${{ vars.EXTENSION_ID }}
      FIREFOX_ADDON_URL: ${{ vars.FIREFOX_ADDON_URL }}
      SOURCE: https://github.com/${{ github.repository }}
      PUBLISH: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Sans ces variables du dépôt, le front publié perdrait ses liens vers l'extension.
      - name: Variables du front (publication)
        if: env.PUBLISH == 'true' && (env.EXTENSION_ID == '' || env.FIREFOX_ADDON_URL == '')
        run: |
          echo "::error::Variables de dépôt EXTENSION_ID et FIREFOX_ADDON_URL requises (Settings → Variables)"
          exit 1

      - name: Build API
        run: >-
          docker build -f apps/api/Dockerfile
          --label "org.opencontainers.image.source=$SOURCE"
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          -t "$REGISTRY/candidash-api:$GITHUB_SHA" -t "$REGISTRY/candidash-api:latest" .

      - name: Build web
        run: >-
          docker build -f apps/web/Dockerfile
          --build-arg "API_URL=$API_URL"
          --build-arg "EXTENSION_ID=$EXTENSION_ID"
          --build-arg "FIREFOX_ADDON_URL=$FIREFOX_ADDON_URL"
          --label "org.opencontainers.image.source=$SOURCE"
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          -t "$REGISTRY/candidash-web:$GITHUB_SHA" -t "$REGISTRY/candidash-web:latest" .

      - name: Vérification de l'image API
        run: apps/api/ci/verify-image.sh "$REGISTRY/candidash-api:$GITHUB_SHA"

      - name: Vérification de l'image web
        run: apps/web/ci/verify-image.sh "$REGISTRY/candidash-web:$GITHUB_SHA" "$API_URL"

      - name: Publication sur GHCR
        if: env.PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push --all-tags "$REGISTRY/candidash-api"
          docker push --all-tags "$REGISTRY/candidash-web"

      # API Dokploy (application.deploy) : l'API d'abord, elle porte les migrations. Sans les
      # secrets (pas encore créés), les images sont publiées et le déploiement reste manuel.
      - name: Déploiement Dokploy
        if: env.PUBLISH == 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_API_APP_ID: ${{ secrets.DOKPLOY_API_APP_ID }}
          DOKPLOY_WEB_APP_ID: ${{ secrets.DOKPLOY_WEB_APP_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_API_APP_ID" ] || [ -z "$DOKPLOY_WEB_APP_ID" ]; then
            echo "::notice::Secrets DOKPLOY_* absents, déploiement Dokploy ignoré"
            exit 0
          fi
          for application in "$DOKPLOY_API_APP_ID" "$DOKPLOY_WEB_APP_ID"; do
            curl --fail-with-body --silent --show-error --max-time 60 -X POST "$DOKPLOY_URL/api/application.deploy" \
              -H 'Content-Type: application/json' -H "x-api-key: $DOKPLOY_API_KEY" \
              -d "{\"applicationId\":\"$application\"}"
          done

  # Base de la preview Vercel = branche Neon `preview` (schéma + seed de démo, jamais de copie de
  # prod). Les migrations de la PR y sont appliquées après validation sur le Postgres jetable du job
  # api. Sans le secret (forks, Dependabot, secret pas encore créé), le job ne fait rien.
  preview-db:
    name: Preview · Migrations Neon
    if: github.event_name == 'pull_request'
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Une seule migration à la fois sur la base partagée, sans en interrompre une en cours
    concurrency:
      group: preview-db
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL_UNPOOLED }}
    steps:
      - name: Secret absent, migrations de preview ignorées
        if: env.DATABASE_URL == ''
        run: echo "::notice::PREVIEW_DATABASE_URL_UNPOOLED absent, migrations de preview ignorées"

      - name: Checkout
        if: env.DATABASE_URL != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        if: env.DATABASE_URL != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        if: env.DATABASE_URL != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install (frozen lockfile)
        if: env.DATABASE_URL != ''
        working-directory: apps/api
        run: pnpm install --frozen-lockfile --filter api

      - name: Migrations (branche Neon preview)
        if: env.DATABASE_URL != ''
        working-directory: apps/api
        run: pnpm db:migrate
