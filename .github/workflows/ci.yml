name: CI

# Sur une PR : construire, tester, juger l'image. Sur master : la même chose, puis publier l'image
# jugée sur GHCR et demander à Dokploy de la déployer (il ne construit plus rien) ; lancé à la main
# sur master, il redéploie. Le run sur master écrit aussi le cache Docker que les PR lisent (GitHub
# cloisonne le cache entre PR).
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Un run par branche/PR : le nouveau push annule le précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build · Test · Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # publication de l'image sur GHCR, utilisée seulement sur master
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Runner jetable : pas de nettoyage du builder en fin de job.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cleanup: false

      # Un seul passage BuildKit : étage `test` (lint, Vitest, garde CSP des templates) et image de
      # production, en parallèle sur les mêmes sources installées, avec le cache GHA.
      - name: Build and test (Dockerfile)
        uses: docker/bake-action@v6
        with:
          source: .
          targets: ci
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      # Pages prérendues et CSP, jugées sur les fichiers que l'image sert.
      - name: Verify served build
        run: |
          set -euo pipefail
          id=$(docker create ng-candidash-app:ci)
          docker cp -q "$id:/usr/share/nginx/html" /tmp/browser
          docker rm -f "$id" > /dev/null
          ci/verify-build.sh /tmp/browser

      - name: Smoke test the image
        run: ci/smoke.sh ng-candidash-app:ci

      # Seule l'image qui vient de passer les tests et le test de fumée est publiée : celle que
      # Dokploy déploie est octet pour octet celle-ci.
      - name: Publish image (master)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image=ghcr.io/${{ github.repository }}
          docker tag ng-candidash-app:ci "$image:sha-${GITHUB_SHA::7}"
          docker tag ng-candidash-app:ci "$image:latest"
          docker push -q "$image:sha-${GITHUB_SHA::7}"
          docker push -q "$image:latest"

      # Dokploy tire `latest` et redémarre le conteneur (API `application.deploy` : le webhook
      # d'une application « image » attend la charge utile de Docker Hub). Sans les secrets,
      # l'étape ne fait rien et le déploiement reste celui configuré dans Dokploy.
      - name: Deploy (Dokploy API)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_APPLICATION_ID" ]; then
            echo "Secrets Dokploy absents : pas de déclenchement."
            exit 0
          fi
          curl -fsS -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" -H 'Content-Type: application/json' \
            -d "{\"applicationId\": \"$DOKPLOY_APPLICATION_ID\"}" -o /dev/null
