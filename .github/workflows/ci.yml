name: CI

# API (apps/api) et front (apps/web) vérifiés en parallèle sur chaque PR et sur master, puis
# leurs images Docker construites et vérifiées. Sur master, les images partent sur GHCR et
# Dokploy redéploie la pile deploy/compose.yaml (deploy/README.md) ; l'API applique ses migrations au démarrage.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Un run par branche/PR : le nouveau push annule le précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · Typecheck · Test · Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: candidash
          POSTGRES_PASSWORD: candidash
          POSTGRES_DB: candidash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U candidash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://candidash:candidash@localhost:5432/candidash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm avant setup-node : la version vient du champ `packageManager` du package.json racine.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrations
        run: pnpm db:migrate

      - name: Tests
        run: pnpm test

      - name: Bundle (image Docker)
        run: pnpm build

  web:
    name: Web · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify build
        run: ci/verify-build.sh dist/ng-candidash-app/browser

  # Images de production : construites et vérifiées sur chaque PR (un Dockerfile cassé se voit
  # avant la fusion), publiées et déployées seulement depuis master.
  images:
    name: Images · Build · Vérification · GHCR
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      SOURCE: https://github.com/${{ github.repository }}
      PUBLISH: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build API
        run: >-
          docker build -f apps/api/Dockerfile
          --label "org.opencontainers.image.source=$SOURCE"
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          -t "$REGISTRY/candidash-api:sha-$GITHUB_SHA" -t "$REGISTRY/candidash-api:latest" .

      - name: Build web
        run: >-
          docker build -f apps/web/Dockerfile
          --label "org.opencontainers.image.source=$SOURCE"
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          -t "$REGISTRY/candidash-web:sha-$GITHUB_SHA" -t "$REGISTRY/candidash-web:latest" .

      - name: Build sauvegarde
        run: >-
          docker build
          --label "org.opencontainers.image.source=$SOURCE"
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          -t "$REGISTRY/candidash-backup:sha-$GITHUB_SHA" -t "$REGISTRY/candidash-backup:latest" deploy/backup

      - name: Vérification de l'image API
        run: apps/api/ci/verify-image.sh "$REGISTRY/candidash-api:sha-$GITHUB_SHA"

      - name: Vérification de l'image web
        run: apps/web/ci/verify-image.sh "$REGISTRY/candidash-web:sha-$GITHUB_SHA"

      # Sauvegarde chiffrée puis restauration identique, devant un Postgres et un stockage S3 jetables.
      - name: Vérification de l'image de sauvegarde
        run: deploy/backup/check.sh "$REGISTRY/candidash-backup:sha-$GITHUB_SHA"

      # Le script de déclenchement est jugé devant un faux Dokploy : une redirection ou un refus
      # doivent échouer, jamais passer pour un déploiement.
      - name: Vérification du déclencheur Dokploy
        run: deploy/trigger-deploy.check.sh

      - name: Publication sur GHCR
        if: env.PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for image in candidash-api candidash-web candidash-backup; do
            docker push --all-tags "$REGISTRY/$image"
          done

      # API Dokploy (`compose.deploy`) : la pile deploy/compose.yaml tire les images qui viennent
      # d'être publiées. Sans les secrets, les images sont publiées et le déploiement reste manuel.
      # Le panneau étant derrière Cloudflare Access, le jeton de service passe par CF_ACCESS_*.
      - name: Déploiement Dokploy
        if: env.PUBLISH == 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "::notice::Secrets DOKPLOY_URL, DOKPLOY_API_KEY ou DOKPLOY_COMPOSE_ID absents, aucun déploiement"
            exit 0
          fi
          deploy/trigger-deploy.sh

      # Sonde du site après le déploiement, si son adresse est renseignée (variable du dépôt) : elle
      # prouve que le site répond, pas que la nouvelle version a remplacé l'ancienne.
      - name: Sonde du site
        if: env.PUBLISH == 'true' && vars.DEPLOY_HEALTH_URL != ''
        env:
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        run: |
          curl --fail --silent --show-error --max-time 10 \
            --retry 18 --retry-delay 10 --retry-all-errors "$DEPLOY_HEALTH_URL" -o /dev/null
